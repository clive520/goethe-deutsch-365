<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- German Tricolor Ribbon Accent on top right -->
  <path d="M380 32 L480 132 L440 172 L340 72 Z" fill="#111827" opacity="0.8"/>
  <path d="M400 52 L500 152 L470 182 L370 82 Z" fill="#ef4444" opacity="0.9"/>
  <path d="M420 72 L520 172 L500 192 L400 92 Z" fill="#f59e0b" opacity="0.9"/>

  <!-- Main Center Badge -->
  <g filter="url(#glow)" transform="translate(256, 210)">
    <!-- Graduation Cap / Book Symbol -->
    <path d="M-120 -20 L0 -70 L120 -20 L0 30 Z" fill="url(#gold)" />
    <path d="M-90 10 L-90 60 C-90 90 90 90 90 60 L90 10 L0 45 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Tassel -->
    <path d="M90 -10 L110 30 L100 80" stroke="#fef08a" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="100" cy="85" r="8" fill="#fef08a" />
  </g>

  <!-- Typography: 365 -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    365
  </text>

  <!-- Typography: DEUTSCH -->
  <text x="256" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#a5b4fc" text-anchor="middle" letter-spacing="8">
    GOETHE DEUTSCH
  </text>
</svg>